{% extends "base.html" %}

{% block content %}
<main class="page-main">
  <p class="eyebrow">404</p>
  <h1>Nothing<br>here.</h1>
  <p class="section-intro">The page you’re looking for has gone quiet.</p>
  <a class="arrow-link" href="/">← Back home</a>
</main>
{% endblock %}

{% block scripts %}
<script>
  fetch("/.netlify/functions/sendMetric", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ metricName: "page.404" })
  }).catch(() => {});
</script>
{% endblock %}
