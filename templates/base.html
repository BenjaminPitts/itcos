<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:image" content="{{ site_url }}/static/itcos-skull.png">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" type="image/png" href="/static/itcos-favicon.png">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="{{ band_name }} home">
        <img src="/static/itcos-logo.png" alt="{{ band_name }}" width="1472" height="460">
      </a>
      <input class="nav-toggle" type="checkbox" id="nav-toggle">
      <label class="nav-toggle-label" for="nav-toggle"><span>Menu</span><b></b></label>
      <nav class="site-nav" aria-label="Main navigation">
        {% for link in navigation %}<a href="{{ link.url }}">{{ link.label }}</a>{% endfor %}
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <div class="footer-inner">
      <span>&copy; {{ year }} {{ band_name }}</span>
      <div class="footer-links">{% for link in social_links %}<a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>{% endfor %}</div>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
